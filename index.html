<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width , initial-scale = 1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link type="image/png" sizes="16x16" rel="icon" href=".../icons8-key-color-16.png">
    </head>
    <body>
        <div class="container">
        <h1 class="title"><span class="first-text">Generate a</span> <span class="second-text">random Password</span></h1>
        <p>Never use an insecure Password again.</p>
        <button id="generate-btn" type="submit">Generate Password</button>
        </div>
        <hr>
        <div class="Password-container">
            <label for="length">Password Length</label>
            <input required id="length" type="number">
            <output id="password-output"></output>
            <button id="copy-btn">Copy</button>
        </div>
        <script type="module" src="Algorithm.js"></script>
    </body>
</html>
